name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Bundle EasyList filter lists
        run: |
          mkdir -p app/src/main/assets/filters
          curl -fsSL --retry 3 https://easylist.to/easylist/easylist.txt -o app/src/main/assets/filters/easylist.txt || echo "easylist download failed"
          curl -fsSL --retry 3 https://easylist.to/easylist/easyprivacy.txt -o app/src/main/assets/filters/easyprivacy.txt || echo "easyprivacy download failed"
          ls -la app/src/main/assets/filters

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/HashBrowser.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: HashBrowser-apk
          path: out/HashBrowser.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hash Browser build ${{ github.run_number }}
          body: Install HashBrowser.apk on your phone. Every build is signed with the same key, so it updates over the previous one.
          files: out/HashBrowser.apk

      - name: Publish APK to apk branch
        run: |
          git config user.name "hash-ci"
          git config user.email "hash-ci@users.noreply.github.com"
          cp out/HashBrowser.apk /tmp/HashBrowser.apk
          git checkout --orphan apk
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/HashBrowser.apk .
          echo "Built from ${GITHUB_SHA}" > BUILD.txt
          git add HashBrowser.apk BUILD.txt
          git commit -m "APK for ${GITHUB_SHA}"
          git push -f origin apk

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "hash-ci"
          git config user.email "hash-ci@users.noreply.github.com"
          tail -n 400 build.log > /tmp/build-log.txt 2>/dev/null || echo "no build log" > /tmp/build-log.txt
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > /tmp/errors.txt 2>/dev/null || true
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/build-log.txt build-log.txt
          cp /tmp/errors.txt errors.txt
          echo "${GITHUB_SHA}" > SHA.txt
          git add build-log.txt errors.txt SHA.txt
          git commit -m "CI log for ${GITHUB_SHA}"
          git push -f origin ci-log
